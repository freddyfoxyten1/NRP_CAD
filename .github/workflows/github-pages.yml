name: Deploy GitHub Pages

# Legacy — prefer Vercel (see docs/VERCEL-SETUP.md). Disable Pages after Vercel serves northpointrp.xyz.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run --cwd ./artifacts/dojrp build
        env:
          BASE_PATH: /
          NODE_ENV: production
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://nrp-cad-api.onrender.com' }}
          VITE_STATS_URL: ${{ vars.VITE_STATS_URL || 'https://vmkfcsbbzuzznwauzsxe.supabase.co/functions/v1/public-stats' }}

      - name: Prepare GitHub Pages files
        run: bun ./scripts/prepare-github-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/dojrp/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
