name: Deploy Supabase public-stats

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - cursor/vps-deploy-ia-roster-fixes
      - cursor/sync-github-preview-3e41
      - cursor/nrp-live-deploy
    paths:
      - "supabase/functions/public-stats/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-stats.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy public-stats function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Skipped: add SUPABASE_ACCESS_TOKEN to GitHub repo secrets."
            echo "Then set function secrets in Supabase: DISCORD_BOT_TOKEN, DISCORD_GUILD_ID"
            echo "Dashboard: https://supabase.com/dashboard/project/vmkfcsbbzuzznwauzsxe/functions"
            exit 0
          fi
          supabase functions deploy public-stats --project-ref vmkfcsbbzuzznwauzsxe --no-verify-jwt
