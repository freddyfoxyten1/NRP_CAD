# DOJCAD — nginx site config for cad.dojrblx.com
#
# Copy to: /etc/nginx/sites-available/dojcad.conf
# Link:    ln -s /etc/nginx/sites-available/dojcad.conf /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx
#
# Prereqs:
#   certbot certonly --nginx -d cad.dojrblx.com
#   (then uncomment the TLS server block below and comment the :80 one)

server {
    listen 80;
    listen [::]:80;
    server_name cad.dojrblx.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

