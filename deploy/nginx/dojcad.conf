# DOJCAD — nginx site config for cad.dojrblx.com
#
# Copy to: /etc/nginx/sites-available/dojcad.conf
# Link:    ln -s /etc/nginx/sites-available/dojcad.conf /etc/nginx/sites-enabled/dojcad.conf
# Test:    nginx -t
# Reload:  systemctl reload nginx
#
# ⚠️ CRITICAL — nginx runs as `www-data` and CANNOT read files under /root/
# (the /root directory is 700, root-only). The repo MUST live somewhere
# nginx can access, e.g. /var/www/dojcad. If you get a 500 error serving
# static files, this is why.
#
# Setup:
#   sudo mkdir -p /var/www
#   sudo cp -a /root/DOJCAD /var/www/dojcad
#   sudo chown -R www-data:www-data /var/www/dojcad
#   (then update the `root` line below if needed)
#
# Certificate (already issued for cad.dojrblx.com):
#   /etc/letsencrypt/live/cad.dojrblx.com/fullchain.pem
#   /etc/letsencrypt/live/cad.dojrblx.com/privkey.pem

# ── HTTP :80 — serve + redirect to HTTPS ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cad.dojrblx.com;

    # Force HTTPS once everything works:
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    root /var/www/dojcad/artifacts/dojrp/dist/public;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# ── HTTPS :443 — production server ──────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cad.dojrblx.com;

    ssl_certificate     /etc/letsencrypt/live/cad.dojrblx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cad.dojrblx.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    root /var/www/dojcad/artifacts/dojrp/dist/public;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}