# DOJCAD — nginx site config for cad.dojrblx.com
#
# Copy to: /etc/nginx/sites-available/dojcad.conf
# Link:    ln -s /etc/nginx/sites-available/dojcad.conf /etc/nginx/sites-enabled/dojcad.conf
# Test:    nginx -t
# Reload:  systemctl reload nginx
#
# IMPORTANT — certificate setup (one-time):
#   Get a cert FOR THIS DOMAIN (cad.dojrblx.com):
#     certbot certonly --nginx -d cad.dojrblx.com
#   Or use the webroot method:
#     certbot certonly --webroot -w /root/DOJCAD/artifacts/dojrp/dist/public -d cad.dojrblx.com
#   This creates certs at:
#     /etc/letsencrypt/live/cad.dojrblx.com/fullchain.pem
#     /etc/letsencrypt/live/cad.dojrblx.com/privkey.pem
#
#   If you already have a cert for portal.dojrblx.com, that does NOT cover
#   cad.dojrblx.com — each subdomain needs its own cert (or a wildcard cert
#   *.dojrblx.com). You MUST run certbot for cad.dojrblx.com.
#
# NOTE: If a conflicting server block (e.g. the portal.dojrblx.com config or
# the default site) is catching requests first, disable it:
#   ls /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/portal.dojrblx.com   # or the default site
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP :80 — serve + redirect to HTTPS ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cad.dojrblx.com;

    # Serve the app on HTTP too (so it works even before HTTPS is set up),
    # plus redirect to HTTPS once the cert exists.
    # Uncomment the return line below AFTER the cert is issued to force HTTPS.
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    root /root/DOJCAD/artifacts/dojrp/dist/public;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# ── HTTPS :443 — the real production server ─────────────────────────────────
# This block activates once the cert for cad.dojrblx.com exists.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cad.dojrblx.com;

    # Cert paths for cad.dojrblx.com (created by certbot above).
    # Do NOT use the portal.dojrblx.com cert here.
    ssl_certificate     /etc/letsencrypt/live/cad.dojrblx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cad.dojrblx.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    root /root/DOJCAD/artifacts/dojrp/dist/public;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}