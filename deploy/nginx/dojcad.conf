# DOJCAD — nginx site config for cad.dojrblx.com
#
# Copy to: /etc/nginx/sites-available/dojcad.conf
# Link:    ln -s /etc/nginx/sites-available/dojcad.conf /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx
#
# This config serves on port 80 (HTTP) immediately.
# After running `certbot --nginx -d cad.dojrblx.com`, certbot will
# automatically add the TLS server block and redirect HTTP→HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name cad.dojrblx.com;

    client_max_body_size 25m;   # matches Express json limit (20mb) + headroom for uploads

    # ── API → bun (bm2-managed) process on :8080 ──────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;               # SSE (/api/phone/events) needs streaming
        proxy_read_timeout 3600s;          # long-lived SSE connections
    }

    # ── Static frontend (vite build output) ───────────────────────────────
    # Adjust this path to match where you cloned the repo.
    root /root/DOJCAD/artifacts/dojrp/dist/public;

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static hashed assets aggressively (vite emits content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}